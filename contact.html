  <style>
    .contact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));

      margin: 20px 0;
    }
    .contact-item {
      padding: 18px 20px;
      border-radius: 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      transition: all 0.2s;
    }
    .contact-item:hover {
      border-color: rgba(92,244,255,0.3);
      box-shadow: 0 0 14px rgba(92,244,255,0.15);
    }
    .contact-item strong { display: block; color: var(--neon1); margin-bottom: 6px; font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; }
    .contact-item span { color: var(--text); font-size: 15px; }
  </style>
